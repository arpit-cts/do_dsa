<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <title>The 3M framework for preventing burnout</title>
  <desc>Three rounded cartoon cards show Micro, Meso, and Macro breaks with simple icons and timing guidance for detaching from work.</desc>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="4" width="992" height="412" rx="24" fill="#FFFDF5" stroke="#E9ECEF" stroke-width="2"/>
    <text x="500" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#212529">The 3M framework for preventing burnout</text>

    <g transform="translate(54 88)">
      <rect x="0" y="0" width="278" height="230" rx="24" fill="#FFF3BF" stroke="#343A40" stroke-width="3"/>
      <g transform="translate(139 46)" stroke="#343A40" stroke-width="3">
        <path d="M-34 -26 C-30 -44 -12 -42 -14 -60" fill="none"/>
        <path d="M2 -28 C7 -45 22 -42 18 -60" fill="none"/>
        <path d="M-55 -14 H25 V27 C25 45 -40 45 -40 27 V-14 Z" fill="#FFE066"/>
        <path d="M25 -5 H43 C57 -5 57 22 43 22 H25" fill="none"/>
        <path d="M-50 36 H34" fill="none"/>
        <circle cx="-24" cy="8" r="4" fill="#343A40" stroke="none"/>
        <circle cx="6" cy="8" r="4" fill="#343A40" stroke="none"/>
        <path d="M-19 23 C-10 31 -2 31 7 23" fill="none"/>
      </g>
      <text x="139" y="130" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">Micro</text>
      <text x="139" y="160" text-anchor="middle" font-size="21" font-weight="700" fill="#212529">every day</text>
      <text x="139" y="188" text-anchor="middle" font-size="18" fill="#212529">at least about</text>
      <text x="139" y="207" text-anchor="middle" font-size="18" fill="#212529">10 minutes</text>
    </g>

    <g transform="translate(361 88)">
      <rect x="0" y="0" width="278" height="230" rx="24" fill="#D0EBFF" stroke="#343A40" stroke-width="3"/>
      <g transform="translate(139 46)" fill="none" stroke="#343A40" stroke-width="3">
        <circle cx="-48" cy="34" r="20" fill="#FFFFFF"/>
        <circle cx="48" cy="34" r="20" fill="#FFFFFF"/>
        <path d="M-48 34 L-18 -10 L20 34 L-48 34 Z" fill="#4DABF7"/>
        <path d="M-18 -10 L10 -10 L48 34"/>
        <path d="M-4 -10 L-18 -10"/>
        <path d="M5 -22 H33"/>
        <path d="M29 -22 L39 -14"/>
        <circle cx="-48" cy="34" r="4" fill="#343A40" stroke="none"/>
        <circle cx="48" cy="34" r="4" fill="#343A40" stroke="none"/>
      </g>
      <text x="139" y="130" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">Meso</text>
      <text x="139" y="160" text-anchor="middle" font-size="21" font-weight="700" fill="#212529">every week</text>
      <text x="139" y="207" text-anchor="middle" font-size="20" fill="#212529">2 to 4 hours</text>
    </g>

    <g transform="translate(668 88)">
      <rect x="0" y="0" width="278" height="230" rx="24" fill="#D3F9D8" stroke="#343A40" stroke-width="3"/>
      <g transform="translate(139 46)" stroke="#343A40" stroke-width="3">
        <path d="M-72 46 L-28 -20 L4 46 Z" fill="#69DB7C"/>
        <path d="M-14 46 L28 -34 L76 46 Z" fill="#69DB7C"/>
        <path d="M28 -34 L45 -5 L20 -12 Z" fill="#FFFFFF"/>
        <line x1="44" y1="-43" x2="44" y2="-11"/>
        <path d="M44 -43 L75 -34 L44 -25 Z" fill="#FFE066"/>
        <line x1="-78" y1="46" x2="82" y2="46"/>
      </g>
      <text x="139" y="130" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">Macro</text>
      <text x="139" y="160" text-anchor="middle" font-size="21" font-weight="700" fill="#212529">every month</text>
      <text x="139" y="188" text-anchor="middle" font-size="18" fill="#212529">half a day to</text>
      <text x="139" y="207" text-anchor="middle" font-size="18" fill="#212529">a full day</text>
    </g>

    <text x="500" y="360" text-anchor="middle" font-size="16" fill="#212529">The rule for all three: complete psychological detachment.</text>
    <text x="500" y="384" text-anchor="middle" font-size="16" fill="#212529">Do something new and hard enough that you cannot think about work.</text>
  </g>
</svg>




