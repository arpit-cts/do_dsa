<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<title>How a habit becomes a highway</title>
<desc>Three cartoon panels showing a stress cue becoming a scrolling highway, then fading with a pause trick.</desc>
<rect x="4" y="4" width="992" height="462" rx="24" fill="#FFFDF5" stroke="#E9ECEF" stroke-width="2"/>
<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#212529">
  <defs><marker id="arrowHabit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B6B"/></marker></defs>
  <text x="50" y="58" font-size="32" font-weight="700">How a habit becomes a highway (and how to fade it)</text>
  <g transform="translate(45 88)">
    <rect x="0" y="0" width="285" height="275" rx="22" fill="#F1F3F5" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="22" y="34" font-size="21" font-weight="700">Day 1</text>
    <g transform="translate(20 70)">
      <path d="M12 42 C6 23,26 18,37 28 C44 8,75 12,76 35 C94 34,103 50,92 65 L19 65 C8 62,3 53,12 42 Z" fill="#D0EBFF" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M27 74 L20 91 M52 74 L45 91 M76 74 L69 91" stroke="#4DABF7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="0" y="123" font-size="15" fill="#495057">stressed · tired</text>
      <text x="9" y="143" font-size="15" fill="#495057">overwhelmed</text>
    </g>
    <path d="M122 165 C168 148,197 148,232 165" fill="none" stroke="#868E96" stroke-width="10" stroke-linecap="round"/>
    <path d="M123 165 C169 148,198 148,231 165" fill="none" stroke="#FFFDF5" stroke-width="3" stroke-dasharray="11 11"/>
    <g transform="translate(220 94)">
      <rect x="0" y="0" width="42" height="72" rx="9" fill="#343A40" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="6" y="9" width="30" height="48" rx="5" fill="#D0EBFF"/>
      <circle cx="21" cy="63" r="3" fill="#F1F3F5"/>
      <text x="-4" y="95" font-size="16" font-weight="700">scroll</text>
    </g>
  </g>
  <g transform="translate(358 88)">
    <rect x="0" y="0" width="285" height="275" rx="22" fill="#FFF3BF" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="22" y="34" font-size="21" font-weight="700">After 1,000 times</text>
    <path d="M247 211 C170 262,95 260,75 225" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowHabit)"/>
    <g transform="translate(18 68)">
      <path d="M12 42 C6 23,26 18,37 28 C44 8,75 12,76 35 C94 34,103 50,92 65 L19 65 C8 62,3 53,12 42 Z" fill="#D0EBFF" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M27 74 L20 91 M52 74 L45 91 M76 74 L69 91" stroke="#4DABF7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="0" y="123" font-size="15" fill="#495057">stressed · tired</text>
      <text x="9" y="143" font-size="15" fill="#495057">overwhelmed</text>
    </g>
    <path d="M114 164 C165 122,211 122,246 159" fill="none" stroke="#343A40" stroke-width="32" stroke-linecap="round"/>
    <path d="M114 164 C165 122,211 122,246 159" fill="none" stroke="#FFFDF5" stroke-width="5" stroke-dasharray="17 14"/>
    <g transform="translate(188 76)">
      <rect x="0" y="0" width="40" height="68" rx="9" fill="#343A40" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="6" y="9" width="28" height="45" rx="5" fill="#D0EBFF"/>
      <text x="-7" y="91" font-size="16" font-weight="700">scroll</text>
    </g>
    <g transform="translate(230 172)">
      <circle cx="18" cy="18" r="18" fill="#FFE3E3" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="11" cy="14" r="3" fill="#212529"/><circle cx="25" cy="14" r="3" fill="#212529"/>
      <path d="M9 28 C15 22,22 22,28 28" fill="none" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="-4" y="54" font-size="16" font-weight="700">guilt</text>
    </g>
  </g>
  <g transform="translate(671 88)">
    <rect x="0" y="0" width="285" height="275" rx="22" fill="#D3F9D8" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="22" y="34" font-size="21" font-weight="700">With the pause trick</text>
    <g transform="translate(18 68)">
      <path d="M12 42 C6 23,26 18,37 28 C44 8,75 12,76 35 C94 34,103 50,92 65 L19 65 C8 62,3 53,12 42 Z" fill="#D0EBFF" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M27 74 L20 91 M52 74 L45 91 M76 74 L69 91" stroke="#4DABF7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="0" y="123" font-size="15" fill="#495057">stressed · tired</text>
      <text x="9" y="143" font-size="15" fill="#495057">overwhelmed</text>
    </g>
    <path d="M105 165 C145 132,182 126,237 139" fill="none" stroke="#868E96" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.55"/>
    <path d="M105 165 C148 178,184 198,233 207" fill="none" stroke="#2F9E44" stroke-width="15" stroke-linecap="round"/>
    <path d="M105 165 C148 178,184 198,233 207" fill="none" stroke="#FFFDF5" stroke-width="3" stroke-dasharray="11 12"/>
    <g transform="translate(112 93)">
      <rect x="0" y="0" width="106" height="69" rx="15" fill="#FFFDF5" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="14" y="22" font-size="16" font-weight="700">PAUSE:</text>
      <text x="12" y="43" font-size="15">what am I</text>
      <text x="26" y="61" font-size="15">feeling?</text>
    </g>
    <g transform="translate(220 184)">
      <circle cx="20" cy="20" r="20" fill="#D0EBFF" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M11 17 C15 13,19 13,23 17 M25 17 C29 13,33 13,37 17 M13 28 C20 36,31 36,38 28" fill="none" stroke="#343A40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="-75" y="57" font-size="15" font-weight="700">60 sec, eyes closed</text>
    </g>
  </g>
  <text x="70" y="425" font-size="18" font-weight="700" fill="#495057">Every trip makes the road deeper. Pause, take a tiny new path, and the old road slowly fades.</text>
</g>
</svg>

