<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <title>Three chronotypes: when is your brain at its best?</title>
  <desc>Cartoon line chart showing AM-shifted, biphasic, and PM-shifted chronotype energy curves from morning to late night, with an afternoon dip highlighted.</desc>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="4" width="992" height="462" rx="24" fill="#FFFDF5" stroke="#E9ECEF" stroke-width="2"/>
    <text x="500" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#212529">Three chronotypes: when is your brain at its best?</text>

    <g transform="translate(0,0)">
      <rect x="415" y="91" width="76" height="270" rx="14" fill="#FFE8CC" opacity="0.78" stroke="none"/>
      <text x="453" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#868E96">afternoon</text>
      <text x="453" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#868E96">dip</text>

      <line x1="110" y1="360" x2="870" y2="360" stroke="#343A40" stroke-width="3"/>
      <line x1="110" y1="90" x2="110" y2="360" stroke="#343A40" stroke-width="3"/>
      <path d="M105 100 L110 90 L115 100" fill="none" stroke="#343A40" stroke-width="3"/>
      <path d="M860 355 L870 360 L860 365" fill="none" stroke="#343A40" stroke-width="3"/>
      <text x="45" y="205" transform="rotate(-90 45 205)" text-anchor="middle" font-size="19" font-weight="700" fill="#212529">energy and focus</text>
      <text x="77" y="112" text-anchor="middle" font-size="16" fill="#868E96">high</text>
      <text x="77" y="353" text-anchor="middle" font-size="16" fill="#868E96">low</text>

      <g stroke="#CED4DA" stroke-width="1.5">
        <line x1="186" y1="90" x2="186" y2="360"/>
        <line x1="262" y1="90" x2="262" y2="360"/>
        <line x1="338" y1="90" x2="338" y2="360"/>
        <line x1="414" y1="90" x2="414" y2="360"/>
        <line x1="490" y1="90" x2="490" y2="360"/>
        <line x1="566" y1="90" x2="566" y2="360"/>
        <line x1="642" y1="90" x2="642" y2="360"/>
        <line x1="718" y1="90" x2="718" y2="360"/>
        <line x1="794" y1="90" x2="794" y2="360"/>
      </g>
      <g font-size="15" fill="#212529">
        <text x="110" y="388" text-anchor="middle">6 AM</text>
        <text x="186" y="388" text-anchor="middle">8 AM</text>
        <text x="262" y="388" text-anchor="middle">10 AM</text>
        <text x="338" y="388" text-anchor="middle">12 PM</text>
        <text x="414" y="388" text-anchor="middle">2 PM</text>
        <text x="490" y="388" text-anchor="middle">4 PM</text>
        <text x="566" y="388" text-anchor="middle">6 PM</text>
        <text x="642" y="388" text-anchor="middle">8 PM</text>
        <text x="718" y="388" text-anchor="middle">10 PM</text>
        <text x="794" y="388" text-anchor="middle">12 AM</text>
        <text x="870" y="388" text-anchor="middle">2 AM</text>
      </g>

      <g transform="translate(127 106)">
        <circle cx="0" cy="0" r="18" fill="#FFE066" stroke="#343A40" stroke-width="3"/>
        <g stroke="#343A40" stroke-width="3">
          <line x1="0" y1="-31" x2="0" y2="-24"/><line x1="0" y1="24" x2="0" y2="31"/>
          <line x1="-31" y1="0" x2="-24" y2="0"/><line x1="24" y1="0" x2="31" y2="0"/>
          <line x1="-22" y1="-22" x2="-17" y2="-17"/><line x1="22" y1="-22" x2="17" y2="-17"/>
          <line x1="-22" y1="22" x2="-17" y2="17"/><line x1="22" y1="22" x2="17" y2="17"/>
        </g>
      </g>
      <g transform="translate(840 111)">
        <path d="M20 -19 C2 -15 -10 -1 -10 16 C-10 28 -2 38 9 42 C-9 47 -31 36 -38 15 C-46 -11 -25 -36 2 -38 C10 -39 17 -32 20 -19 Z" fill="#E5DBFF" stroke="#343A40" stroke-width="3"/>
        <circle cx="8" cy="0" r="3" fill="#343A40"/>
        <circle cx="-6" cy="17" r="3" fill="#343A40"/>
      </g>

      <path d="M110 128 C153 110 198 127 243 170 C320 240 414 262 520 290 C628 317 735 335 870 341" fill="none" stroke="#FFA94D" stroke-width="5"/>
      <path d="M110 319 C168 264 218 139 300 122 C360 110 398 216 445 307 C493 360 579 181 665 146 C735 118 798 208 870 311" fill="none" stroke="#4DABF7" stroke-width="5"/>
      <path d="M110 338 C219 330 331 312 430 270 C538 224 617 153 707 121 C778 98 820 132 870 170" fill="none" stroke="#9775FA" stroke-width="5"/>

      <g transform="translate(628 224)">
        <rect x="0" y="0" width="300" height="128" rx="18" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="2"/>
        <line x1="22" y1="28" x2="58" y2="28" stroke="#FFA94D" stroke-width="5"/>
        <text x="70" y="34" font-size="18" font-weight="700" fill="#212529">AM-shifted · about 1 in 4</text>
        <line x1="22" y1="58" x2="58" y2="58" stroke="#4DABF7" stroke-width="5"/>
        <text x="70" y="64" font-size="18" font-weight="700" fill="#212529">Biphasic · most people</text>
        <line x1="22" y1="88" x2="58" y2="88" stroke="#9775FA" stroke-width="5"/>
        <text x="70" y="94" font-size="18" font-weight="700" fill="#212529">PM-shifted · about 1 in 10</text>
        <text x="70" y="116" font-size="16" font-weight="700" fill="#868E96">(Raj and Sahar)</text>
      </g>
    </g>
    <text x="500" y="435" text-anchor="middle" font-size="15" fill="#868E96">Shapes are illustrative, drawn from how Dr Yousef describes each type.</text>
  </g>
</svg>

